<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="stylesheet" id="hljs-theme" href="">
<style>
:root {
    --fg: #cccccc;
    --panel-bg: #1f1f23;
    --viewer-bg: #2c2c30;
}
body { margin:0; padding:0; font-family:sans-serif; font-size:12px; color:var(--fg); background:var(--panel-bg); }

#console-tab, #source-tab, #network-tab { display: none; }
#source-tab.active, #network-tab.active { display: block; }
#console-tab.active { display: flex; flex-direction: column; position: absolute; inset: 0; }

#console-tab .entries { flex:1; overflow-y:auto; padding:6px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; line-height:1.4; }
#console-tab .entry { display:flex; flex-wrap:wrap; gap:2px 8px; padding:4px 0; border-bottom:1px solid rgba(127,127,127,0.2); }
#console-tab .entry .glyph { flex-shrink:0; width:14px; text-align:center; opacity:0.7; line-height:1.4; }
#console-tab .entry .msg { flex:1; min-width:0; white-space:pre-wrap; word-break:break-word; }
#console-tab .entry .src { flex:0 0 100%; box-sizing:border-box; padding-left:28px; text-align:right; opacity:0.5; font-size:11px; word-break:break-all; }
#console-tab .entry.warn .msg, #console-tab .entry.warn .glyph { color:#fbbf24; opacity:1; }
#console-tab .entry.error .msg, #console-tab .entry.error .glyph,
#console-tab .entry.result_error .msg, #console-tab .entry.result_error .glyph { color:#f87171; opacity:1; }
#console-tab .entry.input .glyph, #console-tab .entry.input .msg { color:#93c5fd; }
#console-tab .entry.result .glyph { color:#93c5fd; }

#console-tab .prompt { display:flex; align-items:center; gap:8px; padding:6px 12px; border-top:1px solid rgba(127,127,127,0.2); background:var(--panel-bg); flex-shrink:0; }
#console-tab .prompt span { color:#93c5fd; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; line-height:1; }
#console-tab .prompt input { flex:1; background:transparent; border:none; outline:none; color:inherit; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; padding:2px 0; }

#source-tab.active { display:flex; flex-direction:column; position:absolute; inset:0; }
#source-tab .source-toolbar { display:flex; flex-direction:column; gap:5px; padding:6px 8px; background:var(--panel-bg); border-bottom:1px solid rgba(127,127,127,0.2); flex-shrink:0; }
#source-tab .source-actions, #source-tab .source-find { display:flex; align-items:center; gap:6px; min-width:0; }
#source-tab .source-toolbar button { border:0; border-radius:4px; padding:4px 8px; background:rgba(127,127,127,0.2); color:var(--fg); font:600 11px -apple-system,BlinkMacSystemFont,sans-serif; }
#source-tab .source-toolbar button:disabled { opacity:0.42; }
#sourceStatus { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:0.65; font-size:11px; }
#sourceFind { flex:1; min-width:0; height:24px; box-sizing:border-box; border:1px solid rgba(127,127,127,0.28); border-radius:4px; padding:2px 7px; background:rgba(0,0,0,0.18); color:var(--fg); font:11px ui-monospace,SFMono-Regular,Menlo,monospace; outline:none; }
#sourceFindCount { flex:0 0 42px; text-align:right; opacity:0.6; font:10px ui-monospace,SFMono-Regular,Menlo,monospace; }
#source-tab .source-view { flex:1; min-height:0; overflow:auto; background:var(--panel-bg); }
#source-tab pre { margin:0; padding:6px 8px; font-size:10.5px; line-height:1.22; white-space:pre; word-wrap:normal; overflow-wrap:normal; tab-size:2; }
#source-tab code { display:block; min-width:max-content; }
#source-tab .source-editor-wrap { display:none; position:relative; flex:1; min-height:0; overflow:hidden; background:var(--panel-bg); }
.source-editor-highlight, #sourceEditor { position:absolute; inset:0; box-sizing:border-box; width:100%; height:100%; margin:0; border:0; padding:6px 8px; font:10.5px/1.22 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre; overflow:auto; overflow-wrap:normal; tab-size:2; }
.source-editor-highlight { z-index:1; pointer-events:none; color:var(--fg); background:var(--panel-bg); }
#sourceEditor { z-index:2; resize:none; outline:none; background:transparent; color:transparent; -webkit-text-fill-color:transparent; -webkit-text-size-adjust:100%; -webkit-appearance:none; caret-color:#93c5fd; }
#sourceEditor::selection { background:rgba(147,197,253,0.28); }
.source-find-match { background:rgba(250,204,21,0.22); border-radius:2px; }
.source-find-current { background:rgba(59,130,246,0.48); outline:1px solid rgba(147,197,253,0.78); }
#source-tab.editing .source-view { display:none; }
#source-tab.editing .source-editor-wrap { display:block; }
code.hljs { background:transparent !important; padding:0 !important; }

.empty { padding:16px; opacity:0.6; }

.req { border-bottom:1px solid rgba(127,127,127,0.2); }
.req > summary { padding:8px 12px; cursor:pointer; list-style:none; display:flex; gap:8px; align-items:center; background:var(--panel-bg); }
.req > summary::-webkit-details-marker { display:none; }
.net-totals { display:none; position:sticky; top:0; z-index:2; padding:8px 12px; gap:8px; align-items:center; background:var(--panel-bg); border-bottom:1px solid rgba(127,127,127,0.2); }
.net-totals.show { display:flex; }
.net-totals .method, .net-totals .status { visibility:hidden; }
.net-totals .size { opacity:1; }
.req[open] > summary { position:sticky; top:32px; z-index:1; }

.method { font-weight:bold; padding:2px 6px; border-radius:4px; min-width:42px; text-align:center; flex-shrink:0; }
.method.GET { background:rgba(60,130,80,0.25); }
.method.POST { background:rgba(60,100,160,0.25); }
.method.PUT, .method.PATCH { background:rgba(160,120,40,0.25); }
.method.DELETE { background:rgba(180,60,60,0.25); }

.url { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.size { opacity:0.6; flex-shrink:0; font-variant-numeric:tabular-nums; }
.status { font-weight:bold; flex-shrink:0; min-width:36px; text-align:right; }
.status.s2xx { color:#4ade80; }
.status.s3xx { color:#fbbf24; }
.status.s4xx, .status.s5xx { color:#f87171; }
.status.s0 { opacity:0.5; }

.body { background:transparent; }
.body pre { margin:0; padding:12px; font-size:11px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word; }
.body img { display:block; margin:0 auto; max-width:100%; height:auto; padding:12px; box-sizing:border-box; background:var(--viewer-bg); }
.model-preview-trigger { display:flex; align-items:center; justify-content:center; width:100%; min-height:220px; border:0; border-radius:0; background:var(--viewer-bg); color:var(--fg); font:600 13px -apple-system,BlinkMacSystemFont,sans-serif; cursor:pointer; }
.model-preview-trigger:active { opacity:0.75; }
.model-overlay[hidden] { display:none !important; }
.model-overlay { position:fixed; inset:0; z-index:1000; display:flex; flex-direction:column; background:var(--viewer-bg); color:var(--fg); }
.model-overlay-toolbar { flex:0 0 44px; display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--panel-bg); border-bottom:1px solid rgba(127,127,127,0.24); box-sizing:border-box; }
.model-overlay-toolbar span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; opacity:0.82; }
.model-overlay-toolbar button { flex:0 0 34px; width:34px; height:34px; border:0; border-radius:17px; background:rgba(127,127,127,0.18); color:var(--fg); font:600 16px -apple-system,BlinkMacSystemFont,sans-serif; }
.model-overlay-stage { flex:1; min-height:0; overflow:hidden; background:var(--viewer-bg); touch-action:none; }
.model-overlay-stage model-viewer,
.model-preview-host { display:block; width:100%; height:100%; min-height:0; background:var(--viewer-bg); touch-action:none; overscroll-behavior:contain; --interaction-prompt-display:none; }
.hidden-model-viewer-slot { display:none !important; width:0 !important; height:0 !important; opacity:0 !important; pointer-events:none !important; }
</style>
</head>
<body>
<div id="console-tab" class="active">
  <div class="entries" id="consoleEntries"></div>
  <form class="prompt" id="consolePrompt"><span>❯</span><input id="consoleInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" /></form>
</div>
<div id="source-tab">
  <div class="source-toolbar">
    <div class="source-actions"><button id="sourceEdit" type="button">Edit</button><button id="sourceApply" type="button" disabled>Apply</button><button id="sourceRevert" type="button" disabled>Revert</button><span id="sourceStatus">Read-only snapshot</span></div>
    <div class="source-find"><input id="sourceFind" type="search" placeholder="Find" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" /><button id="sourceFindPrev" type="button" aria-label="Previous match">↑</button><button id="sourceFindNext" type="button" aria-label="Next match">↓</button><span id="sourceFindCount">0/0</span></div>
  </div>
  <div class="source-view"><pre><code class="language-html"></code></pre></div>
  <div id="sourceEditorWrap" class="source-editor-wrap"><pre class="source-editor-highlight" aria-hidden="true"><code id="sourceEditorHighlight" class="language-html"></code></pre><textarea id="sourceEditor" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></div>
</div>
<div id="network-tab"><div class="net-totals" id="netTotals"><span class="method"></span><span class="url" id="netTotalsCount"></span><span class="size" id="netTotalsSize"></span><span class="status"></span></div><p class="empty">No requests captured yet.</p></div>
<div id="modelOverlay" class="model-overlay" hidden aria-hidden="true">
  <div class="model-overlay-toolbar"><span id="modelOverlayTitle">3D Preview</span><button id="modelOverlayClose" type="button" aria-label="Close model preview">x</button></div>
  <div id="modelStage" class="model-overlay-stage"></div>
</div>
<!--__PANEL_JS__-->
</body>
</html>
