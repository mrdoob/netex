<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
body { margin: 0; padding: 28px 22px; background: Canvas; color: CanvasText; }
main { max-width: 720px; margin: 0 auto; }
h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
p { margin: 0 0 20px; color: color-mix(in srgb, CanvasText 70%, Canvas 30%); line-height: 1.45; }
.grid { display: grid; gap: 10px; }
a { display: block; padding: 14px 16px; border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas 82%); border-radius: 8px; color: CanvasText; text-decoration: none; background: color-mix(in srgb, CanvasText 5%, Canvas 95%); }
a strong { display: block; margin-bottom: 3px; font-size: 15px; }
a span { display: block; font-size: 12px; color: color-mix(in srgb, CanvasText 62%, Canvas 38%); }
</style>
</head>
<body>
<main>
  <h1>Netex</h1>
  <p>A focused Three.js inspection shell. Open an example, inspect it, and use Home to return here.</p>
  <div class="grid">
    <a href="https://threejs.org/examples/"><strong>three.js examples</strong><span>Gallery index and demos</span></a>
    <a href="https://threejs.org/examples/#webgl_animation_keyframes"><strong>Animated model</strong><span>Useful for Three.js panel detection</span></a>
    <a href="https://threejs.org/examples/#webgl_loader_gltf"><strong>glTF loader</strong><span>Useful for Network previews</span></a>
  </div>
</main>
</body>
</html>
