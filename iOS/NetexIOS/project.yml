name: NetexIOS
options:
  bundleIdPrefix: com.mrdoob
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  NetexIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/NetexIOS
      - path: Resources
    info:
      path: Sources/NetexIOS/Info.plist
      properties:
        CFBundleDisplayName: Netex
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrdoob.netex.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NetexIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NetexIOSTests
    dependencies:
      - target: NetexIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrdoob.netex.ios.tests
